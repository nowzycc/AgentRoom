[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "npc-harness"
version = "0.1.0"
description = "Thin shared HTTP client boundary (schema entry + CLI) for the single-authority NPC H5a runtime"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "httpx-sse==0.4.0", "jsonschema==4.26.0", "python-dotenv==1.2.2"]

[project.scripts]
npc-harness = "npc_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/npc_harness"]
