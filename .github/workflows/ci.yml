name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }} / py${{ matrix.python }} / node${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11']
        node: ['22']
    defaults:
      run:
        working-directory: packages/agentroom
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          npm install --no-save --ignore-scripts yaml@^2.9.1
        shell: bash

      - name: Python unit tests (MCP launcher + skill installer)
        run: python -m pytest agent/mcp/tests agent/install/tests -q
        shell: bash

      - name: Node unit tests (Hermes / DSH config writers)
        run: node tests/onboarding/test_config.js
        shell: bash

      - name: Python syntax check
        run: python -m compileall -q agent scripts
        shell: bash

      - name: Node syntax check
        run: |
          for f in main/main.js main/onboarding.js main/preload.js \
                   agent/config/hermes.js agent/config/dsh.js \
                   renderer/onboarding.js renderer/onboarding.preload.js; do
            node --check "$f"
          done
        shell: bash
